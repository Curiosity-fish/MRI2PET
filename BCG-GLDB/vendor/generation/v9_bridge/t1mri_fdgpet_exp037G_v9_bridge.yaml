experiment:
  name: Exp037Gv9_Bridge_Overfit_T10_P2
  description: Gv2 network with direct PET endpoint Bridge prediction and Bridge-P2 timestep weighting.
  seed: 42
  output_dir: experiments/Exp037Gv9_Bridge_Overfit_T10_P2
ae:
  checkpoint_path: experiments/used/Exp033J_AE_patch_pet_full/checkpoints/best.pt
  kind: ae
data:
  image_size: [160, 192, 160]
  patch_size: [40, 48, 40]
  pairs_csv: data/csv/paired_t1mri_fdg_pet_adni_exp020.csv
  split_csv: data/csv/split_t1mri_fdg_pet_adni_overfit_train100_val20_folds5_seed42_unified.csv
  table_csv: datasets/ADNI/adni_core_features.csv
  max_table_delta_days: 90
  normalize_inputs: false
  normalize_targets: false
  parc98_labelmap_path: data/atlas/processed/parc98_labelmap_160x196x160.nii.gz
  parc98_mask_dir: data/atlas/masks/parc98_160x196x160
  fold: 0
  cache_dir: data/cache/t1_fdg_160_192_160_overfit_exp037g_v2
model:
  latent_channels: 4
  channels: [96, 192, 384, 768]
  time_dim: 384
  norm_groups: 8
  dropout: 0.0
  bsfe_channels: [48, 96, 192, 384]
  pre_down_hidden: 8
  bsfe_base_channels: 24
  bsfe_channel_mults: [2, 4, 8, 16]
  bsfe_num_res_blocks: 3
  bsfe_norm_groups: 32
  bsfe_dropout: 0.1
  bsfe_attn_stages: [3]
  bsfe_attn_heads: 4
  bsfe_attn_head_dim: 32
  bsfe_n_tokens: 32
  bsfe_token_dim: 128
  bsfe_global_dim: 256
  head_blocks: 2
  head_out_blocks: 1
  head_extra_up_channels: [64, 32]
dvae:
  latent_dim: 1
table:
  token_dim: 128
  depth: 2
  heads: 4
  ff_mult: 4
  dropout: 0.0
  num_feature_types: 5
  bica_heads: 4
  bica_out_init_std: 0.005
  enc1_max_injection_ratio: 0.01
  enc1_table_update_scale: 0.05
  enc2_max_injection_ratio: 0.02
  enc2_table_update_scale: 0.075
  mid_max_injection_ratio: 0.04
  mid_table_update_scale: 0.10
  dec2_max_injection_ratio: 0.02
  dec2_table_update_scale: 0.075
  dec1_max_injection_ratio: 0.01
  dec1_table_update_scale: 0.05
  terminal_dec0_max_injection_ratio: 0.005
  table_max_update_ratio: 0.1
  image_residual_scale: 0.1
  clinical_decoder_hidden_dim: 64
bsfe:
  checkpoint_path: experiments/used/Exp011b_bsfe_t1mri_fdgpet_fold0/checkpoints/fold0_best.pt
initialization:
  unet_checkpoint: null
diffusion:
  T: 10
  schedule: cosine
  prediction_type: endpoint
  train_timestep: random
bridge:
  sigma_max: 0.25
  p2_gamma: 0.5
  p2_k: 1.0
sampling:
  sampler: ddim
  steps: 10
  eta: 0.0
  p2_gamma: 0.5
global:
  enabled: true
  token_dim: 256
  depth: 3
  heads: 8
  mlp_ratio: 4.0
  dropout: 0.0
  attention_dropout: 0.0
  fusion_gate_bias: -2.0
  fusion_init_alpha: 0.1
  context_weight: 0.05
  multiscale_weight: 0.10
  relation_weight: 0.02
  g3_scale_weight: 0.7
  g2_scale_weight: 0.3
  smooth_l1_beta: 1.0
training:
  epochs: 300
  batch_size: 1
  grad_accum: 2
  stage_a_end_epoch: 0
  stage_b_end_epoch: 0
  table_lr: 0.0001
  semantic_lr: 2.0e-05
  shallow_lr: 5.0e-06
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  num_workers: 0
  pin_memory: true
  amp: bf16
  device: cuda
loss:
  diffusion_v_weight: 1.0
  diffusion_eps_weight: 1.0
  latent_x0_weight: 0.5
  image_weight: 1.0
  bsfe_latent_weight: 0.0
condition_ranking:
  weight: 0.5
  margin: 0.0005
  start_epoch: 1
  every_n_steps: 2
evaluation:
  val_splits: [val_fold0, val_fold1, val_fold2, val_fold3, val_fold4]
  small_val_subjects: 20
  table_sensitivity_batches: 5
numerics:
  fail_fast_nonfinite: true
  gradient_check_every_n_steps: 1
  parameter_check_every_n_steps: 10
clinical_semantic_loss:
  name: HCSPL
  weight: 0.05
  beta: 1.0
  start_epoch: 1
  feature_balanced: true
  target: final_refined_table_tokens_T5_to_observed_normalized_table
