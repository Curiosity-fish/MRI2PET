experiment:
  name: exp026_vram_smoke
  seed: 2026
  output_dir: exp026_outputs/vram_smoke
  initial_checkpoint: null

data:
  train_data: ./data/train
  val_data: null
  table_csv: ./data/table.csv
  image_size: [160, 192, 160]
  patch_size: [40, 48, 40]
  table_cols: null
  standardize_table: true
  allow_unmatched_table: false
  match_policy: nearest
  max_date_delta_days: 30

model:
  image_channels: 1
  latent_channels: 4
  vae_base_channels: 16
  mri_channels: [8, 16, 32, 64]
  local_channels: [32, 64, 96]
  time_dim: 128
  norm_groups: 8
  dropout: 0.0
  table:
    token_dim: 128
    token_grid: [4, 4, 4]
    depth: 2
    heads: 4
    num_feature_types: 1
    feature_type_ids: null
  global_mamba:
    backend: mamba
    allow_test_backend: false
    token_dim: 128
    depth: 2
    state_dim: 16
    conv_width: 4
    expand: 2

diffusion:
  timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02

training:
  device: cuda
  batch_size: 1
  patch_batch_size: 8
  num_workers: 2
  pin_memory: true
  amp: true
  gradient_checkpointing: true
  weight_decay: 0.0001
  gradient_clip: 1.0
  val_interval: 1
  validation_seed: 2601

stages:
  patch_vae:
    enabled: true
    epochs: 1
    learning_rate: 0.0002
    resume: null
    loss:
      patch_reconstruction: 1.0
      gradient: 0.2
      kl: 0.000001
  mri_patch_prior:
    enabled: true
    epochs: 1
    learning_rate: 0.0001
    resume: null
    loss:
      high: 1.0
      middle: 0.5
      low: 0.25
      gradient: 0.2
  local_control:
    enabled: true
    epochs: 1
    learning_rate: 0.0002
    resume: null
    loss:
      noise: 1.0
      latent: 0.5
      mri_prior: 0.2
  table_mri_prior:
    enabled: true
    epochs: 1
    learning_rate: 0.0001
    resume: null
    loss:
      prior: 1.0
      gradient: 0.2
  global_mamba:
    enabled: true
    epochs: 1
    learning_rate: 0.0001
    resume: null
    loss:
      noise: 1.0
      latent: 0.5
  joint_finetune:
    enabled: true
    epochs: 1
    learning_rate: 0.00005
    resume: null
    loss:
      noise: 1.0
      latent: 0.5
      prior: 0.2
      full_pet: 1.0
      seam: 0.2
  decoder_calibration:
    enabled: true
    epochs: 1
    learning_rate: 0.00001
    resume: null
    loss:
      real_latent: 1.0
      predicted_latent: 0.1
