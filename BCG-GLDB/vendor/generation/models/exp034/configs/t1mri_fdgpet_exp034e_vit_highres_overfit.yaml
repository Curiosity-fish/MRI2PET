experiment:
  name: Exp034E_Mamba_X1_Fusion_Optimized_overfit
  description: 'Fair Exp034A-best initialization with direct-x1 axial Mamba fusion, single small-scale fusion initialization, and staged unfreezing.'
  seed: 42
  output_dir: experiments/Exp034E_Mamba_X1_Fusion_Optimized_overfit
ae:
  checkpoint_path: experiments/Exp033J_AE_patch_pet_full/checkpoints/best.pt
  kind: ae
  latent_channels: 4
data:
  image_size: [160, 192, 160]
  patch_size: [40, 48, 40]
  pairs_csv: data/csv/paired_t1mri_fdg_pet_adni_exp020.csv
  split_csv: data/csv/split_t1mri_fdg_pet_adni_overfit_train100_val20_folds5_seed42_unified.csv
  cache_dir: data/cache/t1_fdg_160_192_160_overfit_exp034a
  table_csv: datasets/ADNI/adni_core_features.csv
  normalize_inputs: false
  normalize_targets: false
  parc98_labelmap_path: data/atlas/processed/parc98_labelmap_160x196x160.nii.gz
  fold: 0
model:
  latent_channels: 4
  channels: [96, 192, 384, 768]
  time_dim: 384
  norm_groups: 8
  dropout: 0.0
  latent_shape: [40, 48, 40]
  mamba_token_dim: 128
  mamba_depth: 1
  mamba_d_state: 8
  mamba_d_conv: 3
  mamba_expand: 1
  mamba_line_chunk_size: 256
training:
  epochs: 100
  batch_size: 1
  grad_accum: 4
  learning_rate: 0.0001
  backbone_learning_rate: 0.00001
  mamba_learning_rate: 0.00005
  mamba_warmup_epochs: 10
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  num_workers: 4
  pin_memory: true
  amp: bf16
  device: cuda
evaluation:
  val_splits: [val_fold0, val_fold1, val_fold2, val_fold3, val_fold4]
  small_val_subjects: 20
