experiment:
  name: Exp034C_v2_MRIAE_HighResTableAux_overfit
  description: 'MRI Exp034B-AE latent endpoint, table BiCA at encoder s0/s1 and decoder s1/s0, plus PET-latent-to-table auxiliary supervision.'
  seed: 42
  output_dir: experiments/Exp034C_v2_MRIAE_HighResTableAux_overfit
ae:
  checkpoint_path: experiments/Exp033J_AE_patch_pet_full/checkpoints/best.pt
  kind: ae
mri_ae:
  checkpoint_path: experiments/Exp034B_AE_patch_mri_full/checkpoints/best.pt
  kind: ae
  freeze: true
data:
  image_size: [160, 192, 160]
  patch_size: [40, 48, 40]
  pairs_csv: data/csv/paired_t1mri_fdg_pet_adni_exp020.csv
  split_csv: data/csv/split_t1mri_fdg_pet_adni_overfit_train100_val20_folds5_seed42_unified.csv
  table_csv: datasets/ADNI_NACC_Table.csv
  max_table_delta_days: 90
  normalize_inputs: false
  normalize_targets: false
  parc98_labelmap_path: data/atlas/processed/parc98_labelmap_160x196x160.nii.gz
  fold: 0
  cache_dir: data/cache/t1_fdg_160_192_160_overfit_exp034a
model:
  latent_channels: 4
  channels: [96, 192, 384, 768]
  time_dim: 384
  norm_groups: 8
  dropout: 0.0
table:
  token_dim: 128
  heads: 4
  lambda_init: 0.05
  stage_indices: [0, 1, 5, 6]
  token_grids: [[10, 12, 10], [10, 12, 10], [5, 6, 5], [5, 6, 5], [5, 6, 5], [10, 12, 10], [10, 12, 10]]
loss:
  image_l1_weight: 1.0
  table_aux_weight: 0.05
training:
  epochs: 100
  batch_size: 1
  grad_accum: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  num_workers: 4
  pin_memory: true
  amp: bf16
  device: cuda
evaluation:
  val_splits: [val_fold0, val_fold1, val_fold2, val_fold3, val_fold4]
  small_val_subjects: 20
