experiment:
  name: Exp034M_v2_Curriculum_Av3_Table_BSFE_Mamba_Decoder_ROI_full
  output_dir: experiments/Exp034M_v2_Curriculum_Av3_Table_BSFE_Mamba_Decoder_ROI_full
  seed: 42
ae: {checkpoint_path: experiments/Exp033J_AE_patch_pet_full/checkpoints/best.pt, kind: ae}
mri_ae: {checkpoint_path: experiments/Exp034B_AE_patch_mri_full/checkpoints/best.pt, kind: ae}
data:
  image_size: [160,192,160]
  patch_size: [40,48,40]
  pairs_csv: data/csv/paired_t1mri_fdg_pet_adni_exp020.csv
  split_csv: data/csv/split_t1mri_fdg_pet_adni_exp020_seed42.csv
  cache_dir: data/cache/t1_fdg_160_192_160_exp034m_v2_full
  table_csv: datasets/ADNI_NACC_Table.csv
  max_table_delta_days: 90
  normalize_inputs: false
  normalize_targets: false
  fold: 0
  parc98_labelmap_path: data/atlas/processed/parc98_labelmap_160x196x160.nii.gz
model:
  channels: [64,128,256,512]
  time_dim: 384
  norm_groups: 8
  attention_heads: 4
  latent_channels: 4
  pre_down_hidden: 8
  bsfe_base_channels: 24
  bsfe_channel_mults: [2,4,8,16]
  bsfe_num_res_blocks: 3
  bsfe_norm_groups: 32
  bsfe_dropout: 0.1
  bsfe_attn_stages: [3]
  bsfe_attn_heads: 4
  bsfe_attn_head_dim: 32
  bsfe_n_tokens: 32
  bsfe_token_dim: 128
  bsfe_global_dim: 256
  head_blocks: 2
  head_out_blocks: 1
  head_extra_up_channels: [64,32]
  head_use_global_film: true
  head_use_token_film: true
  head_use_token_cross_attn: true
  head_attn_heads: 4
table: {token_dim: 128}
bsfe:
  checkpoint_path: experiments/Exp011b_bsfe_t1mri_fdgpet_fold0/checkpoints/fold0_best.pt
training:
  epochs: 300
  num_workers: 4
  stage_batch_sizes: [2,2,1,1,1,1]
  learning_rate: 0.00005
  weight_decay: 0.0001
dvae: {latent_dim: 1}
evaluation:
  val_splits: [val]
