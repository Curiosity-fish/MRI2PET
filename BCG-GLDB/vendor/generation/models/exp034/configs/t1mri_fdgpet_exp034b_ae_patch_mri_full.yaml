experiment:
  seed: 42
  output_dir: experiments/Exp034B_AE_patch_mri_full
  name: Exp034B_AE_patch_mri_full
  description: 'Exp034B: Exp033J-style Patch AE trained to reconstruct MRI on the full exp020 fold0 split. Four-channel latent at image/4, patch 40x48x40.'
  method: ae
data:
  pairs_csv: data/csv/paired_t1mri_fdg_pet_adni_exp020.csv
  split_csv: data/csv/split_t1mri_fdg_pet_adni_exp020_seed42.csv
  image_size: [160, 192, 160]
  patch_size: [40, 48, 40]
  fold: 0
  cache_dir: ./data/cache/t1_fdg_160_192_160_exp033
  normalize_targets: false
  reconstruction_key: mri
  parc98_labelmap_path: data/atlas/processed/parc98_labelmap_160x196x160.nii.gz
  val_max_samples: 40
model:
  latent_channels: 4
  base_channels: 16
  norm_groups: 8
  dropout: 0.0
loss:
  lambda_patch_recon: 1.0
  lambda_full_recon: 1.0
  kl:
    enabled: false
    max_weight: 0.0
    warmup_start_epoch: 1
    warmup_epochs: 1
training:
  epochs: 100
  batch_size: 1
  patch_batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.0
  num_workers: 8
  pin_memory: true
  device: cuda
evaluation:
  val_splits: [val]
