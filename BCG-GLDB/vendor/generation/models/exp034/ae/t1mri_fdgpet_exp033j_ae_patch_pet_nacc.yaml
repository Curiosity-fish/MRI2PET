experiment:
  seed: 42
  output_dir: experiments/Exp033J_AE_patch_pet_NACC
  name: Exp033J_AE_patch_pet_NACC
  description: 'Exp033J AE (4ch latent, patch 40x48x40) trained on the NACC
    subject-level fixed train/val/final_val split (7:2:1; 255/73/36 pairs),
    reusing the NACC preprocessed cache. 100 epochs, same arch as Exp032b
    (base_channels=16, latent_channels=4). This is the frozen AE latent space
    used by Exp033h_BSFEAdaTable_NACC.'
  method: ae
data:
  pairs_csv: generalization/data/paired_t1mri_fdg_pet_nacc_table.csv
  split_csv: data/csv/split_t1mri_fdg_pet_nacc_seed42.csv
  image_size:
  - 160
  - 192
  - 160
  patch_size:
  - 40
  - 48
  - 40
  fold: 0
  cache_dir: ./data/cache/t1_fdg_160_192_160_nacc
  normalize_targets: false
  parc98_labelmap_path: data/atlas/processed/parc98_labelmap_160x196x160.nii.gz
  val_max_samples: 40
model:
  latent_channels: 4
  base_channels: 16
  norm_groups: 8
  dropout: 0.0
loss:
  lambda_patch_recon: 1.0
  lambda_full_recon: 1.0
  kl:
    enabled: true
    max_weight: 0.001
    warmup_start_epoch: 1
    warmup_epochs: 20
training:
  epochs: 100
  batch_size: 1
  patch_batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.0
  num_workers: 8
  pin_memory: true
  device: cuda
evaluation:
  val_splits:
  - val
