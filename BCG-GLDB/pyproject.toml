[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mri2pet-thesis"
version = "0.1.0"
description = "Thesis-aligned 3D MRI-to-FDG-PET synthesis and multimodal classification"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.7,<3", "numpy>=1.24,<3", "pandas>=2,<3", "nibabel>=5,<6",
  "scikit-learn>=1.4,<2", "PyYAML>=6,<7", "monai>=1.4,<2", "scipy>=1.11,<2"
]

[tool.setuptools.packages.find]
include = ["mri2pet*"]
