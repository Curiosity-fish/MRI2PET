seed: 42
output_dir: experiments/paper_classification
data:
  # Point to the final 995-row classification labels and subject-level split.
  root: ./data
  labels_csv: classier/data/final_995_labels.csv
  split_csv: classier/data/final_995_subject_split.csv
  generation_split_csv: data/csv/split_t1mri_fdg_pet_adni_exp020_seed42.csv
  table_csv: datasets/ADNI/adni_core_features.csv
  train_splits: [train, val]
  test_split: final_val
  image_shape: [160, 192, 160]
training:
  epochs: 100
  batch_size: 4
  lr: 0.0001
  weight_decay: 0.0001
  num_workers: 4
experiments:
  source_real_tglm: {model: tglm, modality: mri_pet, pet_path_col: fdg_pet_path}
  source_ours_tglm: {model: tglm, modality: mri_pet, pet_path_col: synth_ours_path}
